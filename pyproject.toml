[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ppt-gen"
version = "0.1.0"
description = "Conversor moderno de imagens e PDF para apresentações PowerPoint (PPT/PPTX)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Tiago" }
]

dependencies = [
    "attrs>=23.2.0",
    "boltons>=23.1.1",
    "msgspec>=0.18.6",
    "pillow>=10.2.0",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "pymupdf>=1.23.26",
    "python-box>=7.1.1",
    "python-pptx>=0.6.23",
    "pywebview>=6.2.1",
    "pyyaml>=6.0.1",
    "toolz>=0.12.1",
]

[project.urls]
Homepage = "https://github.com/T-Woi/ppt_gen"
Documentation = "https://github.com/T-Woi/ppt_gen#readme"
Repository = "https://github.com/T-Woi/ppt_gen.git"
Releases = "https://github.com/T-Woi/ppt_gen/releases"
Issues = "https://github.com/T-Woi/ppt_gen/issues"

[dependency-groups]
dev = [
    "bandit>=1.7.8",
    "mypy>=1.9.0",
    "pyinstaller>=6.5.0",
    "pytest>=8.1.1",
    "pytest-cov>=5.0.0",
    "ruff>=0.3.4",
    "types-PyYAML>=6.0.12.20240311",
]

[project.scripts]
ppt-gen = "main:cli_main"

[tool.uv]
default-groups = ["dev"]

[tool.hatch.build.targets.wheel]
packages = ["src/core", "src/server", "src/web"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", ".venv", "build", "dist", "packaging"]
skips = ["B101", "B104", "B110", "B404", "B603", "B607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=90"
