<!-- ========================================================================= -->
<!-- BARRA SUPERIOR (Top App Bar - Material Design 3 / Glassmorphic)           -->
<!-- ========================================================================= -->
<header class="app-header">
  <div class="header-container">
    <!-- Marca & Logo com Ícone em Camadas e Imagem Oficial -->
    <div class="brand-link" id="btnLogoHome" role="button" tabindex="0" title="Ir para o início do PPT-Gen">
      <div class="brand-logo-container">
        <img src="assets/logo.webp" alt="PPT-Gen Logo" class="brand-logo-img">
      </div>
      <div class="brand-text-wrap">
        <span class="brand-title">PPT-Gen</span>
        <span class="brand-badge">STUDIO</span>
      </div>
    </div>


    <!-- Ações do Lado Direito -->
    <div class="header-right">
      <!-- Botão de Ajuda / Atalhos -->
      <button id="btnShortcutsHelp" class="icon-action-btn" type="button" title="Atalhos de Teclado (F1 / ?)"
        aria-label="Atalhos de Teclado">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
          <line x1="12" y1="17" x2="12.01" y2="17"></line>
        </svg>
      </button>

      <!-- Alternador de Tema Claro / Escuro -->
      <button id="themeToggleBtn" class="icon-action-btn" type="button" title="Alternar tema claro/escuro"
        aria-label="Alternar tema">
        <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </div>
  </div>
</header>
