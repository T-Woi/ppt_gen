<!-- ========================================================================= -->
<!-- ESTADO 2: WORKSPACE E EDITOR DE SLIDES                                    -->
<!-- ========================================================================= -->
<main class="editor-container" id="editorView" style="display: none;">
  <div class="editor-layout">

    <!-- Coluna Principal dos Slides -->
    <section class="slides-column">
      <!-- Barra de Ações Superior do Workspace (Sub-Toolbar Glassmorphic) -->
      <div class="editor-toolbar">
        <div class="toolbar-left">
          <span class="badge badge-primary" id="slideCountTag">0 slides</span>
          <div class="source-info-pill" title="Origem dos arquivos">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
            </svg>
            <span class="source-label" id="sourceDescLabel">Carregando...</span>
          </div>
        </div>

        <!-- Ações da Barra de Ferramentas -->
        <div class="toolbar-actions">
          <!-- Dropdown "+ Adicionar Mais" -->
          <div class="dropdown-wrap">
            <button id="btnAddMoreToggle" class="btn btn-tonal btn-sm" type="button" aria-haspopup="true" aria-expanded="false">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
              <span>Adicionar</span>
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </button>
            <div class="dropdown-menu" id="addMoreMenu" role="menu">
              <button id="btnAddFolder" type="button" role="menuitem">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                </svg>
                <span>Pasta com Imagens</span>
              </button>
              <button id="btnAddPdf" type="button" role="menuitem">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                  <polyline points="14 2 14 8 20 8"></polyline>
                </svg>
                <span>Arquivo PDF</span>
              </button>
              <button id="btnAddImages" type="button" role="menuitem">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                  <circle cx="8.5" cy="8.5" r="1.5"></circle>
                  <polyline points="21 15 16 10 5 21"></polyline>
                </svg>
                <span>Imagens Avulsas</span>
              </button>
            </div>
          </div>

          <div class="toolbar-divider" aria-hidden="true"></div>

          <!-- Botão Ordem Natural -->
          <button id="btnNaturalSort" class="btn btn-outlined btn-sm" type="button" title="Ordenar por nome natural inteligente (1, 2, ..., 10)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="4" y1="6" x2="11" y2="6"></line>
              <line x1="4" y1="12" x2="11" y2="12"></line>
              <line x1="4" y1="18" x2="13" y2="18"></line>
              <polyline points="15 9 18 6 21 9"></polyline>
              <line x1="18" y1="6" x2="18" y2="18"></line>
            </svg>
            <span>Ordem Natural</span>
          </button>

          <!-- Botão Inverter Ordem -->
          <button id="btnReverseOrder" class="btn btn-outlined btn-sm" type="button" title="Inverter a sequência dos slides">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="17 1 21 5 17 9"></polyline>
              <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
              <polyline points="7 23 3 19 7 15"></polyline>
              <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
            </svg>
            <span>Inverter</span>
          </button>

          <!-- Botão Limpar Tudo -->
          <button id="btnClearAll" class="btn btn-danger-ghost btn-sm" type="button" title="Remover todos os slides carregados">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
            <span>Limpar</span>
          </button>
        </div>
      </div>

      <!-- Dica de Organização Drag & Drop (Fixa) -->
      <div class="workspace-tip-banner">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="16" x2="12" y2="12"></line>
          <line x1="12" y1="8" x2="12.01" y2="8"></line>
        </svg>
        <span><strong>Dica:</strong> Arraste e solte os cards para reorganizar a ordem dos slides na apresentação. Passe o mouse para girar ou inspecionar.</span>
      </div>

      <!-- Grade de Slides Interativa (Único Elemento com Scroll Vertical) -->
      <div class="slides-grid" id="slidesGrid"></div>
    </section>

    <!-- Painel Lateral de Configurações (M3 Surface Container / Sticky Aside) -->
    <aside class="settings-sidebar">
      <div class="sidebar-surface">
        <div class="sidebar-header">
          <div class="sidebar-title-row">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="4" y1="21" x2="4" y2="14"></line>
              <line x1="4" y1="10" x2="4" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="12"></line>
              <line x1="12" y1="8" x2="12" y2="3"></line>
              <line x1="20" y1="21" x2="20" y2="16"></line>
              <line x1="20" y1="12" x2="20" y2="3"></line>
              <line x1="1" y1="14" x2="7" y2="14"></line>
              <line x1="9" y1="8" x2="15" y2="8"></line>
              <line x1="17" y1="16" x2="23" y2="16"></line>
            </svg>
            <h2 class="sidebar-title">Configurações</h2>
          </div>
          <p class="sidebar-subtitle">Ajuste dimensões, cores e formato do arquivo</p>
        </div>

        <!-- Seção 1: Proporção da Tela -->
        <div class="setting-group">
          <label class="setting-label">Proporção da Tela</label>
          <div class="segmented-control" id="aspectSegmented" role="radiogroup" aria-label="Proporção do Slide">
            <button type="button" class="segment-btn active" data-val="16:9" role="radio" aria-checked="true" title="Widescreen Moderno (1920×1080)">
              <svg width="18" height="14" viewBox="0 0 24 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="2" width="20" height="12" rx="2"></rect>
              </svg>
              <span><strong>16:9</strong> Widescreen</span>
            </button>
            <button type="button" class="segment-btn" data-val="4:3" role="radio" aria-checked="false" title="Padrão Clássico (1024×768)">
              <svg width="16" height="14" viewBox="0 0 20 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="2" width="16" height="14" rx="2"></rect>
              </svg>
              <span><strong>4:3</strong> Padrão</span>
            </button>
          </div>
        </div>

        <!-- Seção 2: Enquadramento da Imagem -->
        <div class="setting-group">
          <label class="setting-label">Enquadramento da Imagem</label>
          <div class="segmented-control" id="fitSegmented" role="radiogroup" aria-label="Modo de Ajuste">
            <button type="button" class="segment-btn active" data-val="fit" role="radio" aria-checked="true" title="Sem cortes: a imagem cabe inteira no slide com barras laterais se necessário">
              <span>Ajustar</span>
            </button>
            <button type="button" class="segment-btn" data-val="fill" role="radio" aria-checked="false" title="Preenche 100% da tela sem barras">
              <span>Preencher</span>
            </button>
            <button type="button" class="segment-btn" data-val="stretch" role="radio" aria-checked="false" title="Estica até as bordas exatas">
              <span>Esticar</span>
            </button>
          </div>
        </div>

        <!-- Seção 3: Cor de Fundo dos Slides -->
        <div class="setting-group">
          <label class="setting-label">Cor de Fundo do Slide</label>
          <div class="color-swatches-row" role="radiogroup" aria-label="Cor de Fundo">
            <button type="button" class="color-swatch-btn active" data-color="#FFFFFF" role="radio" aria-checked="true" title="Fundo Branco">
              <span class="swatch-indicator" style="background: #FFFFFF; border: 1px solid #d1d5db;"></span>
              <span>Branco</span>
            </button>
            <button type="button" class="color-swatch-btn" data-color="#000000" role="radio" aria-checked="false" title="Fundo Preto">
              <span class="swatch-indicator" style="background: #000000;"></span>
              <span>Preto</span>
            </button>
            <button type="button" class="color-swatch-btn" data-color="transparent" role="radio" aria-checked="false" title="Fundo Transparente">
              <span class="swatch-indicator checkerboard"></span>
              <span>Transparente</span>
            </button>
          </div>
        </div>

        <!-- Seção 4: Nome e Pasta de Destino -->
        <div class="setting-group destination-group">
          <label class="setting-label" for="exportFilenameInput">Nome da Apresentação</label>
          <div class="input-addon-wrap">
            <input type="text" id="exportFilenameInput" placeholder="MinhaApresentacao" value="Apresentacao">
            <span class="input-addon-badge">.pptx</span>
          </div>

          <label class="setting-label" for="exportFolderInput" style="margin-top: 0.85rem;">Salvar em</label>
          <div class="input-action-wrap">
            <input type="text" id="exportFolderInput" placeholder="Selecione a pasta de destino..." readonly>
            <button id="btnBrowseDest" class="btn btn-outlined btn-sm" type="button" title="Escolher outra pasta no Windows">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
              </svg>
              <span>Alterar</span>
            </button>
          </div>
        </div>

        <!-- Botão Principal de Conversão (Hero CTA M3 Elevated) -->
        <div class="export-cta-wrap">
          <button id="btnExportPptx" class="btn btn-hero btn-brand btn-block" type="button">
            <span class="btn-spinner" id="exportSpinner" style="display:none;" aria-hidden="true"></span>
            <div class="btn-cta-content" id="exportBtnContent">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                <line x1="12" y1="22.08" x2="12" y2="12"></line>
              </svg>
              <span id="exportBtnText">Converter para PowerPoint</span>
              <span class="cta-arrow" aria-hidden="true">→</span>
            </div>
          </button>
          <span class="cta-shortcut-hint">Pressione <strong>Ctrl + Enter</strong> para converter</span>
        </div>

      </div>
    </aside>

  </div>
</main>
