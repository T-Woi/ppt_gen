name: Release PPT-Gen Studio

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag de versão (ex: v0.1.0). Se vazio, usa a tag atual ou v{pyproject.toml}'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Windows Installer & Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Inno Setup 6
        run: |
          choco install innosetup --no-progress

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.12
        run: |
          uv python install 3.12

      - name: Install dependencies
        run: |
          uv sync --frozen

      - name: Run Quality Gate & Test Suite
        run: |
          uv run pytest

      - name: Build Standalone Application & Installer
        run: |
          uv run python packaging/build_installer.py

      - name: Verify Installer Artifacts
        shell: bash
        run: |
          if [ ! -f "dist/PPT-Gen-Studio-Setup.exe" ]; then
            echo "::error::dist/PPT-Gen-Studio-Setup.exe not found!"
            exit 1
          fi
          if [ ! -f "dist/PPT-Gen-Studio-Setup.exe.sha256" ]; then
            echo "::error::dist/PPT-Gen-Studio-Setup.exe.sha256 not found!"
            exit 1
          fi
          echo "Artifacts verified successfully."

      - name: Determine Release Tag
        id: release_info
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            VERSION=$(uv run python -c "from pathlib import Path; [print(l.split('=')[1].strip().strip('\"\'')) for l in Path('pyproject.toml').read_text(encoding='utf-8').splitlines() if l.strip().startswith('version')]")
            TAG="v${VERSION}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: "PPT-Gen Studio ${{ steps.release_info.outputs.tag }}"
          target_commitish: ${{ github.sha }}
          files: |
            dist/PPT-Gen-Studio-Setup.exe
            dist/PPT-Gen-Studio-Setup.exe.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
